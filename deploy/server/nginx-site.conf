# New Era Trading - nginx site (installed by deploy/server/setup-server.sh, which fills the __PLACEHOLDERS__).
# The website (HTML/CSS/JS) and the Laravel API share one domain: the document root is backend/public.
# certbot adds the HTTPS (443) block and the http -> https redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIR__/backend/public;
    index index.html index.php;
    charset utf-8;
    client_max_body_size 16m;                       # KYC uploads (3 files x 4 MB)
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # only index.php may run PHP; any other .php path is a 404
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/neweratrading.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }

    # never serve dot-files (.env, .git ...), dumps, logs or backups
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|gz|zip|log|bak|sqlite|cnf|md)$ { deny all; }

    # static files: short browser cache (the site is updated often)
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|svg|ico|gif)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
