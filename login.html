<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — New Era Trading</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side">
    <a class="brand" href="index.html"><img class="logo-img" src="images/logo.png" alt="New Era Trading">New Era Trading</a>
    <h2>Welcome back</h2>
    <ul>
      <li>Track your team in real time</li>
      <li>See every commission in your ledger</li>
      <li>Withdraw to your preferred method</li>
    </ul>
  </aside>

  <main class="auth-main">
    <div class="auth-box">
      <h1>Sign in</h1>
      <p class="muted">Enter your credentials to access your account.</p>

      <div class="form-error" id="err" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <div class="field" id="otpField" hidden><label for="otp">Verification code</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code from your e-mail"><div class="hint" id="otpHint"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        <p class="muted small" style="text-align:right;margin:.6rem 0 0"><a href="forgot.html">Forgot password?</a></p>
      </form>

      <p class="muted small mt">New here? <a href="register.html">Create an account</a> · <a href="index.html">Back to home</a></p>

      <div class="demo-box" id="demoBox" hidden>
        <b>Demo accounts</b><br>
        <span id="demoBtns"></span>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  Store.ready.then(function () {
    var form = document.getElementById('loginForm'), err = document.getElementById('err');
    var show = function (msg) { err.textContent = msg; err.hidden = !msg; };
    var existing = Store.currentUser();
    if (existing) { location.replace((existing.role === 'admin' ? 'admin' : 'user') + '/dashboard.html'); return; }
    if (Store.error) show(Store.error);   // e.g. backend not running
    var dl = Store.demoLogins();   // only a demo server (DEMO_MODE=true with DEMO_* set in its .env) sends these
    document.getElementById('demoBox').hidden = !(Store.isDemo() && dl);
    if (dl) {
      document.getElementById('demoBtns').innerHTML = ['member', 'admin'].filter(function (k) { return dl[k]; }).map(function (k) {
        return '<button type="button" class="btn btn-outline btn-sm" data-fill="' + dl[k].email + '|' + dl[k].password + '">' + (k === 'admin' ? 'Admin' : 'Member') + ': ' + dl[k].email + '</button> ';
      }).join('');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true; show('');
      var needOtp = !document.getElementById('otpField').hidden;
      var call = needOtp ? Store.loginVerify(form.email.value, form.password.value, document.getElementById('otp').value.trim()) : Store.login(form.email.value, form.password.value);
      call.then(function (r) {
        btn.disabled = false;
        if (r.otpRequired) {   // admin account: step 2 — the e-mailed code
          document.getElementById('otpField').hidden = false;
          document.getElementById('otpHint').textContent = 'We e-mailed a 6-digit code to ' + r.sentTo + '. It expires in 10 minutes.';
          document.getElementById('otp').focus();
          return;
        }
        if (!r.ok) return show(r.error);
        location.href = (r.user.role === 'admin' ? 'admin' : 'user') + '/dashboard.html';
      });
    });

    document.querySelectorAll('[data-fill]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.dataset.fill.split('|');
        form.email.value = p[0]; form.password.value = p[1];
      });
    });
  });
</script>
</body>
</html>
