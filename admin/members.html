<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members — Admin</title>
  <link rel="icon" href="../images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/panel.css">
</head>
<body data-role="admin" data-page="members" data-title="Members" data-base="../">
<main id="page-content" hidden>
  <div class="card">
    <div class="toolbar">
      <div class="field"><label for="q">Search</label><input id="q" placeholder="Name, email or code"></div>
      <div class="field"><label for="st">Status</label>
        <select id="st"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="blocked">Blocked</option></select></div>
      <div class="field"><label for="pk">Cap type</label><select id="pk"><option value="">All</option><option value="working">Working (5X)</option><option value="non">Non-working (2X)</option></select></div>
    </div>
    <div class="muted small" id="count"></div>
    <div id="list"></div>
  </div>
</main>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  Store.ready.then(function () {
  var me = Layout.mount();
  if (me) {
    var $ = function (id) { return document.getElementById(id); };
    var flags = {};   // open alerts per member, shown as a red ⚠ tag next to the name
    function loadFlags() {
      Store.riskAlerts({ status: 'open', limit: 300 }).then(function (r) {
        if (!r.ok) return;
        flags = {}; r.items.forEach(function (a) { if (a.userId) flags[a.userId] = (flags[a.userId] || 0) + 1; });
        draw();
      });
    }
    function openProfile(id) { if (window.AdminRisk) window.AdminRisk.openMember(id); else UI.toast('Still loading, try again in a second', 'err'); }
    function draw() {
      var q = $('q').value.toLowerCase(), st = $('st').value, pk = $('pk').value;
      var list = Store.members().filter(function (u) {
        if (q && (u.name + u.email + u.code).toLowerCase().indexOf(q) < 0) return false;
        if (pk === 'working' && !Store.isWorking(u.id)) return false;
        if (pk === 'non' && Store.isWorking(u.id)) return false;
        if (st === 'blocked' && !u.blocked) return false;
        if (st === 'active' && !Store.isActive(u)) return false;
        if (st === 'inactive' && (u.invested > 0 || u.blocked)) return false;
        return true;
      });
      $('count').textContent = list.length + ' member(s)';
      $('list').innerHTML = UI.table(['Member', 'Sponsor', 'Invested', 'Earning cap', 'Status', 'Wallet', 'Team', 'Joined', ''],
        list.map(function (u) {
          var sp = u.sponsorId ? Store.byId(u.sponsorId) : null, c = Store.capInfo(u.id);
          return ['<a href="#" data-view="' + u.id + '"><b>' + UI.esc(u.name) + '</b></a>' + (flags[u.id] ? '<span class="mem-flag" data-view="' + u.id + '" title="Open alerts">⚠ ' + flags[u.id] + '</span>' : '') + '<br><small class="muted">' + UI.esc(u.code) + ' · ' + UI.esc(u.email) + '</small>',
            sp ? UI.esc(sp.code) : '—', UI.pkgBadge(u), c.mult + 'X · ' + c.pct + '% used', UI.statusBadge(u), UI.money(u.wallet), Store.teamSize(u.id), UI.date(u.joined),
            '<button class="btn btn-sm btn-outline" data-view="' + u.id + '">Details</button> <button class="btn btn-sm ' + (u.blocked ? 'btn-success' : 'btn-ghost') + '" data-block="' + u.id + '">' + (u.blocked ? 'Unblock' : 'Block') + '</button>'];
        }), 'No members match your filters.');
      document.querySelectorAll('[data-view]').forEach(function (b) { b.onclick = function (e) { e.preventDefault(); openProfile(Number(b.dataset.view)); }; });
      document.querySelectorAll('[data-block]').forEach(function (b) {
        b.onclick = function () {
          var u = Store.byId(Number(b.dataset.block)), nb = !u.blocked;
          b.disabled = true;
          Store.setBlocked(u.id, nb).then(function (r) { UI.toast(r.ok ? u.name + (nb ? ' blocked' : ' unblocked') : r.error, r.ok ? 'ok' : 'err'); draw(); });
        };
      });
    }
    ['q', 'st', 'pk'].forEach(function (id) { $(id).addEventListener('input', draw); });
    window.__membersRedraw = function () { loadFlags(); };
    draw(); loadFlags();
  }
  });
</script>
</body>
</html>
